name: CI Pipeline - Core Verification & Guardrails

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  core-verification:
    name: Core Guardrails (Build, Test, Security)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Restore Dependencies
        run: dotnet restore

      # -------------------------------------------------------------
      # 🛑 HARD GUARDRAILS (BẮT BUỘC 100% MERGE GATE)
      # -------------------------------------------------------------
      - name: 🛠️ [01 CODE] Build Verification (Must Compile)
        run: dotnet build --no-restore --configuration Release

      - name: 🧪 [06 & 07 TEST] Run Unit Tests
        run: dotnet test tests/unit/UnitTests.csproj --no-build --configuration Release

      - name: 🐳 [06 TEST] Run Integration Tests
        run: dotnet test tests/integration/IntegrationTests.csproj --no-build --configuration Release

      - name: 🔒 [09 SEC] Hardcoded Secrets Scan
        run: |
          echo "Scanning for hardcoded API keys or credentials..."
          if git grep -E "(api_key|password|secret)\s*=\s*['\"][^'\"]+['\"]" -- 'src/*'; then
            echo "❌ ERROR: Found potential hardcoded secrets in src/"
            exit 1
          fi

      # -------------------------------------------------------------
      # ⚠️ SOFT WARNINGS (CẢNH BÁO - KHÔNG BLOCK CODE)
      # -------------------------------------------------------------
      - name: 🔍 Check Leftover Debug Logs & TODOs (Warning Only)
        run: |
          echo "Checking for console.log / debugger / TODO statements..."
          git grep -i -E "console\.log|debugger|TODO|FIXME" -- 'src/*' || echo "✅ No debug/TODO comments found."
