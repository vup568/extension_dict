syntax = "proto3";

package tokenizer.v1;

option csharp_namespace = "Infrastructure.Adapters.Grpc";

service TokenizerService {
  rpc Tokenize (TokenizeRequest) returns (TokenizeResponse);
}

message TokenizeRequest {
  // Ephemeral input, at most 2000 UTF-16 units; never logged or persisted.
  string text = 1;
  // A, B, or C (default C). Other modes return INVALID_ARGUMENT.
  string mode = 2;
}

message TokenSpec {
  string surface = 1;
  string base_form = 2;
  string pos = 3;
  // Half-open UTF-16 code-unit offsets into the request text (not code points).
  int32 span_start = 4;
  int32 span_end = 5;
}

message TokenizeResponse {
  repeated TokenSpec tokens = 1;
}
