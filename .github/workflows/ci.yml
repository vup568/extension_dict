name: CI Pipeline - Check Agent Code & Build Verification

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build-and-test:
    name: Build & Run Tests (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Restore dependencies
        run: dotnet restore

      - name: 🛠️ Build solution
        run: dotnet build --no-restore --configuration Release

      - name: 🧪 Run Unit Tests
        run: dotnet test tests/unit/UnitTests.csproj --no-build --configuration Release

      - name: 🐳 Run Integration Tests
        run: dotnet test tests/integration/IntegrationTests.csproj --no-build --configuration Release

  agent-code-checks:
    name: Agent Code Quality Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Check for leftover debug logs
        run: |
          echo "Scanning for debugger or console.log statements..."
          if git grep -i -E "debugger|console\.log" -- 'src/*'; then
            echo "❌ LỖI: Phát hiện debug statement còn sót trong thư mục src/"
            exit 1
          fi

      - name: 🔒 Check hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          if git grep -E "(api_key|password|secret)\s*=\s*['\"][^'\"]+['\"]" -- 'src/*'; then
            echo "❌ LỖI: Phát hiện secret/password bị hardcode trong src/"
            exit 1
          fi
